<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vt</title>
  <meta name="description" content="Video theatre. Separate from vp.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="lobby" class="lobby">
    <header class="mast">
      <div class="brand">vt</div>
      <p class="tag">Video theatre</p>
    </header>
    <p id="lead" class="lead">Pick a house. The player stays vp.</p>
    <div class="clip-bar">
      <button id="load-clips" type="button">Load local clips</button>
      <span id="clip-status" class="clip-status"></span>
      <input id="local-clips" class="hidden" type="file" accept="video/mp4" multiple webkitdirectory>
    </div>
    <button id="lobby-back" class="text-back hidden" type="button">← Houses</button>
    <div id="houses" class="houses"></div>
  </div>

  <div id="stage-wrap" class="stage-wrap hidden">
    <button id="back" class="back" type="button">← Lobby</button>
    <iframe id="stage" title="Theatre" allow="autoplay; fullscreen"></iframe>
    <video id="player" class="hidden" controls playsinline></video>
  </div>

  <script src="app.js"></script>
</body>
</html>
